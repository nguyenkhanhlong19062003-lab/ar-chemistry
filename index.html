<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Mô Phỏng Na + H2O (Tự Lặp)</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-particle-system-component@1.1.3/dist/aframe-particle-system-component.min.js"></script>
</head>
<body>
    <a-scene>
        <a-sky color="#87CEEB"></a-sky>
        
        <a-plane position="0 0 -2" rotation="-90 0 0" width="10" height="10" color="#7f8c8d"></a-plane>

        <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
        <a-light type="directional" position="-1 2 1" intensity="0.5"></a-light>

        <a-entity position="0 0.5 -2">
            <a-cylinder position="0 0 0" radius="1.2" height="0.4" color="#ffffff" opacity="0.3" material="side: double"></a-cylinder>
            <a-cylinder position="0 0.1 0" radius="1.15" height="0.2" color="#3498db" opacity="0.8"></a-cylinder>
            
            <a-sphere id="sodium" position="0 1.5 0" radius="0.1" color="#bdc3c7"></a-sphere>

            <a-entity id="reactionEffect" position="0 0.2 0" 
                      particle-system="color: #ffa502,#ff7f50; size: 0.5, 0; velocityValue: 0 1 0; particleCount: 0; maxAge: 1; distribution: sphere; radius: 0.2">
            </a-entity>
        </a-entity>

        <a-camera position="0 1.6 0"></a-camera>
    </a-scene>

    <script>
        const na = document.getElementById('sodium');
        const effect = document.getElementById('reactionEffect');

        function runExperiment() {
            // Xóa các hiệu ứng chuyển động cũ
            na.removeAttribute('animation__fall');
            na.removeAttribute('animation__moveX');
            na.removeAttribute('animation__moveZ');

            // Reset trạng thái mẩu Natri lên cao
            na.setAttribute('position', '0 1.5 0');
            na.setAttribute('color', '#bdc3c7');
            na.setAttribute('visible', 'true');
            
            // Reset Khói lửa
            effect.setAttribute('particle-system', 'particleCount: 0; color: #ffa502,#ff7f50; velocityValue: 0 1 0; size: 0.5, 0; maxAge: 1;');

            // BƯỚC 1: Na rơi xuống nước
            setTimeout(() => {
                na.setAttribute('animation__fall', 'property: position; to: 0 0.2 0; dur: 800; easing: easeInQuad');
                
                // BƯỚC 2: Phản ứng cháy và chạy vòng quanh
                setTimeout(() => {
                    na.setAttribute('color', '#ff6b81');
                    na.setAttribute('animation__moveX', 'property: position.x; from: -0.5; to: 0.5; dir: alternate; dur: 150; loop: 15');
                    na.setAttribute('animation__moveZ', 'property: position.z; from: -0.5; to: 0.5; dir: alternate; dur: 220; loop: 10');
                    effect.setAttribute('particle-system', 'particleCount: 200');

                    // BƯỚC 3: Phát nổ
                    setTimeout(() => {
                        effect.setAttribute('particle-system', 'color: #ffffff,#f1c40f; particleCount: 1500; velocityValue: 0 3 0; size: 1, 0; maxAge: 1.5;');
                        na.setAttribute('visible', 'false');

                        // BƯỚC 4: Dọn dẹp và lặp lại
                        setTimeout(() => {
                            effect.setAttribute('particle-system', 'particleCount: 0');
                            // Nghỉ 2 giây rồi lặp lại từ đầu
                            setTimeout(runExperiment, 2000); 
                        }, 2000);

                    }, 2500); // Thời gian chạy trên nước
                }, 800); // Đợi rơi xong
            }, 1000); // Đợi 1 giây trước khi bắt đầu rơi
        }

        // Đợi 3D load xong thì gọi vòng lặp
        document.querySelector('a-scene').addEventListener('loaded', () => {
            runExperiment();
        });
    </script>
</body>
</html>
