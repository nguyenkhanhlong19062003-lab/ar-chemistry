<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR Hóa Học: Phản ứng Na + H2O</title>
    <!-- Nhúng thư viện A-Frame -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <!-- Nhúng thư viện AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <!-- Nhúng thư viện tạo hiệu ứng hạt (Lửa/Khói) -->
    <script src="https://unpkg.com/aframe-particle-system-component@1.1.3/dist/aframe-particle-system-component.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden; font-family: sans-serif;">

    <!-- Nút tương tác UI -->
    <div style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10;">
        <button id="dropBtn" style="padding: 15px 30px; font-size: 18px; font-weight: bold; background: #ff4757; color: white; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
            Thả Natri (Na)
        </button>
    </div>

    <!-- Cảnh AR -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix;">
        
        <!-- Sử dụng Marker chuẩn 'Hiro' -->
        <a-marker preset="hiro">
            
            <!-- Chậu thủy tinh -->
            <a-cylinder position="0 0.1 0" radius="1.2" height="0.4" color="#ffffff" opacity="0.3" material="side: double"></a-cylinder>
            <!-- Nước trong chậu -->
            <a-cylinder position="0 0.2 0" radius="1.15" height="0.2" color="#3498db" opacity="0.7"></a-cylinder>
            
            <!-- Mẩu Natri (Màu xám bạc, lơ lửng bên trên trước khi thả) -->
            <a-sphere id="sodium" position="0 1.5 0" radius="0.1" color="#bdc3c7" visible="true"></a-sphere>

            <!-- Hiệu ứng lửa/khói (Ban đầu tắt particleCount: 0) -->
            <a-entity id="reactionEffect" position="0 0.3 0" 
                      particle-system="color: #ffa502,#ff7f50; size: 0.5, 0; velocityValue: 0 1 0; particleCount: 0; maxAge: 1; distribution: sphere; radius: 0.2">
            </a-entity>

        </a-marker>
        
        <!-- Camera -->
        <a-entity camera></a-entity>
    </a-scene>

    <!-- Kịch bản logic mô phỏng phản ứng -->
    <script>
        document.getElementById('dropBtn').addEventListener('click', function() {
            const na = document.getElementById('sodium');
            const effect = document.getElementById('reactionEffect');
            const btn = document.getElementById('dropBtn');
            
            btn.disabled = true;
            btn.innerText = "Đang phản ứng...";
            btn.style.background = "#747d8c";

            // BƯỚC 1: Mẩu Na rơi xuống nước
            na.setAttribute('animation__fall', 'property: position; to: 0 0.3 0; dur: 800; easing: easeInQuad');

            setTimeout(() => {
                // BƯỚC 2: Phản ứng tỏa nhiệt, Na bắt đầu chạy trên mặt nước (do khí H2 đẩy)
                // Đổi màu Na thành đỏ cam (nóng chảy)
                na.setAttribute('color', '#ff6b81'); 
                
                // Chuyển động hỗn loạn (mô phỏng)
                na.setAttribute('animation__moveX', 'property: position.x; from: -0.5; to: 0.5; dir: alternate; dur: 150; loop: 15');
                na.setAttribute('animation__moveZ', 'property: position.z; from: -0.5; to: 0.5; dir: alternate; dur: 220; loop: 10');
                
                // Bật hiệu ứng khói/lửa nhỏ
                effect.setAttribute('particle-system', 'particleCount: 200');

                // BƯỚC 3: Phát nổ và cháy rụi
                setTimeout(() => {
                    // Cháy bùn lên
                    effect.setAttribute('particle-system', 'color: #ffffff,#f1c40f; particleCount: 1500; velocityValue: 0 3 0; size: 1, 0; maxAge: 1.5;');
                    // Biến mất mẩu Na
                    na.setAttribute('visible', 'false');

                    // BƯỚC 4: Kết thúc phản ứng, tắt khói
                    setTimeout(() => {
                        effect.setAttribute('particle-system', 'particleCount: 0');
                        btn.disabled = false;
                        btn.innerText = "Làm lại thí nghiệm";
                        btn.style.background = "#2ed573";
                        
                        // Reset vị trí để thử lại
                        btn.onclick = () => location.reload();
                    }, 2000);

                }, 2500); // 2.5 giây chạy trên mặt nước
            }, 800); // Đợi rơi xong (0.8s)
        });
    </script>
</body>
</html>
